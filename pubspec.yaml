name: offline_stt_workspace
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - packages/offline_stt
  - apps/example

dev_dependencies:
  melos: ^8.2.2

melos:
  name: offline_stt_workspace

  scripts:
    analyze:
      description: 全パッケージで dart analyze を実行する。
      exec:
        command: dart analyze --fatal-infos .
        concurrency: 1
    test:
      description: test/ を持つ全パッケージで dart test を実行する。
      exec:
        command: dart test
        concurrency: 1
      packageFilters:
        dirExists: test
    get:
      description: 全パッケージで pub get を実行する(通常は workspace 解決で不要)。
      exec:
        command: dart pub get
        concurrency: 1
    format:
      description: >-
        dart format の差分チェックを行う(CI用、Issue #25)。Pigeon生成物
        (*.g.dart)はコミット対象の生成コードであり手動整形しない方針
        (design.md §2.3)のため対象から除外する。
      run: >-
        find . -name '*.dart' -not -name '*.g.dart'
        -not -path '*/.dart_tool/*' -not -path '*/build/*'
        -print0 | xargs -0 dart format --output=none --set-exit-if-changed
    doc:
      description: >-
        offline_stt で dart doc を実行し、APIドキュメントが生成できる
        ことを検証する(Issue #63)。`--validate-links` により、docコメント
        中の `[...]` 参照切れとREADMEの相対リンク切れを検出する。出力先の
        `doc/api/` は .gitignore 済み。apps/example は公開しないため
        除外する(Issue #91 で単一パッケージへ統合したため、対象は
        offline_stt 1つだけである)。
      exec:
        command: dart doc --validate-links --output doc/api
        concurrency: 1
      packageFilters:
        ignore:
          - example
    publish:dry-run:
      description: >-
        pub.dev への公開対象である offline_stt で
        `dart pub publish --dry-run` を実行し、公開できる状態であることを
        検証する(Issue #65、docs/PUBLISHING.md)。Issue #91 で単一
        パッケージへ統合したため、公開するのは offline_stt 1つだけである。
        apps/example は publish_to: none であるため、
        `packageFilters.private: false`(melos 8の `--no-private` 相当。
        `publish_to: none` のパッケージを除外する)だけで自動的に除外できる。
        個別の ignore リストは書かない。
      exec:
        command: dart pub publish --dry-run
        concurrency: 1
      packageFilters:
        private: false
    pigeon:
      description: >-
        pigeons/offline_stt_events.dart から offline_stt の Dart + Kotlin +
        Swift を生成する(design.md §2.3、Issue #24)。単一パッケージへ統合
        したため(Issue #91)、生成先は packages/offline_stt の1つだけで
        あり、Dart側の pigeon.g.dart も Android/Darwin で共用する1本に
        まとめている。チャネル名は `--package_name` から決まるため、
        Dart/Kotlin/Swift の3者で同じ値を指定すること。
      run: >-
        ROOT="$(pwd)" && cd packages/offline_stt && dart run pigeon
        --input "$ROOT/pigeons/offline_stt_events.dart"
        --package_name offline_stt
        --dart_out lib/src/pigeon.g.dart
        --kotlin_out android/src/main/kotlin/com/moongift/offline_stt/Pigeon.g.kt
        --kotlin_package com.moongift.offline_stt
        --swift_out darwin/Classes/Pigeon.g.swift
