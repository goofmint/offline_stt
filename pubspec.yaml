name: offline_stt_workspace
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - packages/offline_stt
  - packages/offline_stt_platform_interface
  - packages/offline_stt_android
  - packages/offline_stt_darwin
  - packages/offline_stt_windows
  - packages/offline_stt_web
  - apps/example

dev_dependencies:
  melos: ^8.2.2

melos:
  name: offline_stt_workspace

  scripts:
    analyze:
      description: 全パッケージで dart analyze を実行する。
      exec:
        command: dart analyze --fatal-infos .
        concurrency: 1
    test:
      description: test/ を持つ全パッケージで dart test を実行する。
      exec:
        command: dart test
        concurrency: 1
      packageFilters:
        dirExists: test
    get:
      description: 全パッケージで pub get を実行する(通常は workspace 解決で不要)。
      exec:
        command: dart pub get
        concurrency: 1
    format:
      description: >-
        dart format の差分チェックを行う(CI用、Issue #25)。Pigeon生成物
        (*.g.dart)はコミット対象の生成コードであり手動整形しない方針
        (design.md §2.3)のため対象から除外する。
      run: >-
        find . -name '*.dart' -not -name '*.g.dart'
        -not -path '*/.dart_tool/*' -not -path '*/build/*'
        -print0 | xargs -0 dart format --output=none --set-exit-if-changed
    doc:
      description: >-
        apps/example を除く6パッケージ(offline_stt_windows を含む)で
        dart doc を実行し、APIドキュメントが生成できることを検証する
        (Issue #63)。`--validate-links` により、docコメント中の `[...]`
        参照切れとREADMEの相対リンク切れを検出する。出力先の `doc/api/` は
        .gitignore 済み。apps/example は公開しないため除外する。**pub.dev
        への公開対象は offline_stt_windows を除く5パッケージのみである**
        (publish_to: none。理由は docs/PUBLISHING.md 1節)。公開対象の
        絞り込みは publish:dry-run script(下記)の
        `packageFilters.private: false` を参照。
      exec:
        command: dart doc --validate-links --output doc/api
        concurrency: 1
      packageFilters:
        ignore:
          - example
    publish:dry-run:
      description: >-
        pub.dev への公開対象5パッケージ(offline_stt_platform_interface /
        offline_stt_darwin / offline_stt_android / offline_stt_web /
        offline_stt)で `dart pub publish --dry-run` を実行し、公開できる
        状態であることを検証する(Issue #65、docs/PUBLISHING.md)。
        `offline_stt_windows` は publish_to: none(v1では公開対象外。
        理由は docs/PUBLISHING.md 1節)、apps/example も publish_to: none
        であるため、`packageFilters.private: false`(melos 8の
        `--no-private` 相当。`publish_to: none` のパッケージを除外する)
        だけで自動的にこの2つを除外できる。個別の ignore リストは書かない。
      exec:
        command: dart pub publish --dry-run
        concurrency: 1
      packageFilters:
        private: false
    pigeon:android:
      description: >-
        pigeons/offline_stt_events.dart から offline_stt_android 向けの
        Dart + Kotlin を生成する(design.md §2.3、Issue #24)。
      run: >-
        ROOT="$(pwd)" && cd packages/offline_stt_android && dart run pigeon
        --input "$ROOT/pigeons/offline_stt_events.dart"
        --package_name offline_stt_android
        --dart_out lib/src/pigeon.g.dart
        --kotlin_out android/src/main/kotlin/com/moongift/offline_stt_android/Pigeon.g.kt
        --kotlin_package com.moongift.offline_stt_android
    pigeon:darwin:
      description: >-
        pigeons/offline_stt_events.dart から offline_stt_darwin 向けの
        Dart + Swift を生成する(design.md §2.3、Issue #24)。
      run: >-
        ROOT="$(pwd)" && cd packages/offline_stt_darwin && dart run pigeon
        --input "$ROOT/pigeons/offline_stt_events.dart"
        --package_name offline_stt_darwin
        --dart_out lib/src/pigeon.g.dart
        --swift_out darwin/Classes/Pigeon.g.swift
    pigeon:windows:
      description: >-
        pigeons/offline_stt_windows.dart から offline_stt_windows 向けの
        Dart + C++ を生成する(design.md §2.3、Issue #24)。EventChannelは
        Pigeon の C++ 生成器が未対応のため、Android/Darwinとはスキーマ
        ファイル自体を分けている(pigeons/offline_stt_windows.dart 冒頭
        コメント参照)。
      run: >-
        ROOT="$(pwd)" && cd packages/offline_stt_windows && dart run pigeon
        --input "$ROOT/pigeons/offline_stt_windows.dart"
        --package_name offline_stt_windows
        --dart_out lib/src/pigeon.g.dart
        --cpp_header_out windows/pigeon.g.h
        --cpp_source_out windows/pigeon.g.cpp
        --cpp_namespace offline_stt_windows
    pigeon:
      description: >-
        pigeons/ 配下の全スキーマから Android/Darwin/Windows 向けの生成物を
        再生成する(Issue #24)。個別実行は pigeon:android / pigeon:darwin /
        pigeon:windows を参照。
      run: >-
        melos run pigeon:android &&
        melos run pigeon:darwin &&
        melos run pigeon:windows
