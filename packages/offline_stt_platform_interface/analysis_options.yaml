include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    # 公開APIのdocコメント欠落を静的解析で検出する(Issue #63)。
    # 本リポジトリのdocコメントは design.md / requirements.md の節番号と
    # 既知の制約を記録する役目を持つため、記述漏れをレビュー任せにしない。
    - public_member_api_docs
    - unawaited_futures
