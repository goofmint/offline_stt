name: offline_stt_darwin
description: >-
  offline_stt のiOS/macOS共用実装(Swift、SpeechAnalyzer + AVFoundation、
  design.md §4.2)。
version: 0.1.0
homepage: https://github.com/goofmint/offline_stt
repository: https://github.com/goofmint/offline_stt
issue_tracker: https://github.com/goofmint/offline_stt/issues

environment:
  sdk: ^3.9.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  offline_stt_platform_interface: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^27.3.0
  test: ^1.25.0

flutter:
  plugin:
    implements: offline_stt
    platforms:
      ios:
        pluginClass: OfflineSttDarwinPlugin
        dartPluginClass: OfflineSttDarwin
        sharedDarwinSource: true
      macos:
        pluginClass: OfflineSttDarwinPlugin
        dartPluginClass: OfflineSttDarwin
        sharedDarwinSource: true
