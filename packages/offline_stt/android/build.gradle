group 'com.moongift.offline_stt'
version '0.1.0'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.moongift.offline_stt'
    // requirements.md NFR-4: Android 12 (API 31) 以上
    compileSdk 35

    defaultConfig {
        minSdk 31
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            // JVMユニットテスト(src/test/)では android.jar がスタブであり、
            // 未モックのAndroid APIを呼ぶと既定では例外になる。
            // RealtimePump は送出中断時に android.util.Log へ記録するため、
            // キャンセル経路のテストがログ呼び出しで落ちないようにする。
            // 対象は src/test/ のみで、実機の挙動には影響しない。
            returnDefaultValues = true
        }
    }
}

dependencies {
    // 標準 android.speech.SpeechRecognizer はAndroid SDK同梱APIであり追加の
    // 依存を必要としない(design.md §4.3(wt73版)冒頭「バックエンド差し替えの
    // 経緯」参照。ML Kit GenAI Speech Recognition〈genai-speech-recognition〉
    // は不採用のため追加しない)。
    // 実時間ポンプ(RealtimePump.kt)・デコード層がコルーチンを使うための依存。
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    testImplementation "junit:junit:4.13.2"
}
