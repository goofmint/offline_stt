name: offline_stt
description: >-
  Transcribe audio files offline using only the speech recognition built into
  the OS. Nothing is sent over the network. Android, iOS, macOS and Web.
version: 0.1.1
homepage: https://github.com/goofmint/offline_stt
repository: https://github.com/goofmint/offline_stt
issue_tracker: https://github.com/goofmint/offline_stt/issues
topics:
  - speech-to-text
  - stt
  - offline
  - transcription
  - on-device

environment:
  sdk: ^3.9.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Web実装(lib/src/web/)がプラグイン登録エントリポイントで使う。
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.15.0
  # Web実装(lib/src/web/)のWeb Speech / Web Audio連携(design.md §4.1)。
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Pigeon生成物の再生成(ルート pubspec.yaml の melos script `pigeon`)。
  pigeon: ^27.3.0
  test: ^1.25.0

flutter:
  plugin:
    # 単一パッケージで全プラットフォームの実装を持つ(Issue #91)。
    # federated plugin の `implements:` / `default_package:` は使わない。
    platforms:
      android:
        package: com.moongift.offline_stt
        pluginClass: OfflineSttAndroidPlugin
      ios:
        pluginClass: OfflineSttDarwinPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: OfflineSttDarwinPlugin
        sharedDarwinSource: true
      web:
        pluginClass: OfflineSttWeb
        fileName: src/web/offline_stt_web.dart
