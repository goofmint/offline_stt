name: offline_stt_android
description: >-
  offline_stt のAndroid(Kotlin)実装。Android標準android.speech.SpeechRecognizer
  (オンデバイス) + MediaCodecデコード + リサンプリング + 実時間ポンプ
  (PR #73 design.md §4.3)。
version: 0.1.0
homepage: https://github.com/goofmint/offline_stt
repository: https://github.com/goofmint/offline_stt
issue_tracker: https://github.com/goofmint/offline_stt/issues
topics:
  - speech-to-text
  - stt
  - offline
  - transcription
  - on-device

environment:
  sdk: ^3.9.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  offline_stt_platform_interface: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^27.3.0
  test: ^1.25.0

flutter:
  plugin:
    implements: offline_stt
    platforms:
      android:
        package: com.moongift.offline_stt_android
        pluginClass: OfflineSttAndroidPlugin
        dartPluginClass: OfflineSttAndroid
