name: example
description: >-
  offline_stt の参照実装example app(Issue #32・#41)。ファイルピッカー →
  モデル状態表示 → ダウンロード同意ダイアログ → 文字起こし進行表示、の
  一連の正しい使い方を示す(design.md §7)。
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  offline_stt: ^0.2.0
  # Web専用: file_pickerで取得したバイト列からBlob URL(ObjectURL)を
  # 生成するために使用する(design.md §2.2「Webでは Blob URL / ObjectURL」)。
  # lib/src/object_url_web.dart でのみ import する(条件付きexportにより
  # 非Webプラットフォームのビルドには含まれない)。offline_stt のWeb実装が
  # 依存する package:web と同じメジャーバージョン系列を使う。
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Android実機E2E(Issue #50)を integration_test/ で自動化するため。
  # 本番実装(packages/ 配下)を実機上でそのまま呼び出して検証する。
  integration_test:
    sdk: flutter
  # 同E2Eで基準音声の配置先(アプリ専用外部ストレージ)を得るために使う。
  # このディレクトリは Context.getExternalFilesDir() 経由でしか作れない。
  # 生パスへの Directory.createSync() は Permission denied になり、
  # adb shell 側で作ったディレクトリはアプリから読めない(いずれも実測)。
  path_provider: ^2.1.5

flutter:
  uses-material-design: true
  assets:
    # Darwin 実機/デスクトップE2E(Issue #40)で使う基準音声。
    # macOS の example app は App Sandbox 有効でリポジトリ配下を直接読めず、
    # iOS 実機にはホストのファイルシステムが見えないため、両プラットフォーム
    # 共通の唯一の経路としてアセットへ焼き込む(理由の詳細は
    # tool/stage_baseline_audio.sh 冒頭)。
    # 中身は tool/stage_baseline_audio.sh が test-assets/baseline-audio/
    # から複製する。**リポジトリには .gitkeep しか入っていない**ため、
    # E2E を実行する前に必ずこのスクリプトを走らせること。
    - assets/baseline-audio/
