name: Publish to pub.dev

# offline_stt の公開ワークフロー(Issue #65 / #91、docs/PUBLISHING.md)。
#
# 公開対象は `offline_stt` 1つだけである。Issue #91 で federated plugin の
# 6パッケージ構成をやめ、単一パッケージへ統合した。そのため公開順序の強制
# (依存先が pub.dev 上に存在することの検証)は不要になっている。
#
# トリガは `offline_stt-v<version>` 形式の git tag push である。
# pub.dev の Automated publishing 設定(Admin → Automated publishing の
# Tag pattern)には `offline_stt-v{{version}}` を登録すること。
# 手順は docs/PUBLISHING.md を参照。
on:
  push:
    tags:
      - 'offline_stt-v*'

env:
  # .github/workflows/ci.yml の env.FLUTTER_VERSION / FLUTTER_CHANNEL と
  # 同じ値を使うこと。CI と公開ワークフローで異なる Flutter 版を使うと、
  # CI を通ったコミットが公開時にだけ壊れる事態になりうる
  # (docs/VERSION_POLICY.md 1.1節「同時に直す場所」と同じ理由でここも
  # 手動で同期する必要がある)。
  FLUTTER_VERSION: '3.47.5'
  FLUTTER_CHANNEL: 'stable'
  PACKAGE_DIR: packages/offline_stt

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      # OIDC (Trusted Publishing) を使うために必須。この権限があると
      # `ACTIONS_ID_TOKEN_REQUEST_URL` / `ACTIONS_ID_TOKEN_REQUEST_TOKEN` が
      # 実行環境に渡される。後述の dart-lang/setup-dart がこの2つの
      # 環境変数を検知して、pub.dev 向けのOIDCトークンを取得し
      # `dart pub token add` で登録する。
      id-token: write
      contents: read
    steps:
      # Action は可変タグではなく不変のコミットSHAで固定する。このワークフローは
      # `id-token: write` を持ち pub.dev へ公開できるため、タグの差し替えが
      # そのまま公開権限の乗っ取りになりうる。**バージョンを上げるときは
      # SHAと右側のコメントを必ず同時に直すこと。**
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # GITHUB_TOKEN を .git/config に残さない。このジョブは git push を
          # しないため資格情報は不要である。
          persist-credentials: false

      - name: タグの version と pubspec.yaml の version が一致することを検証する
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            offline_stt-v*)
              TAG_VERSION="${TAG#offline_stt-v}"
              ;;
            *)
              # on.push.tags のパターンに合致した時点でここには来ないはず
              # だが、フォールバックせず明示的に失敗させる(リポジトリ方針:
              # フォールバック禁止)。
              echo "::error::tag '${TAG}' が 'offline_stt-v<version>' 形式ではない" >&2
              exit 1
              ;;
          esac
          PUBSPEC_VERSION="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')"
          if [ -z "$PUBSPEC_VERSION" ]; then
            echo "::error::pubspec.yaml から version を読み取れなかった" >&2
            exit 1
          fi
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::タグの version (${TAG_VERSION}) と pubspec.yaml の version (${PUBSPEC_VERSION}) が一致しない" >&2
            exit 1
          fi
          echo "OK: offline_stt ${PUBSPEC_VERSION} を公開する"

      # --- ここから先が SDK セットアップ。順序が重要 ---
      #
      # 1. dart-lang/setup-dart を Flutter のセットアップより先に実行する。
      #    このアクションは Dart SDK を入れるだけでなく、
      #    `ACTIONS_ID_TOKEN_REQUEST_URL` が存在する場合に
      #    `core.getIDToken('https://pub.dev')` でOIDCトークンを取得し、
      #    `dart pub token add https://pub.dev --env-var PUB_TOKEN` を実行して
      #    `$PUB_CACHE` にトークンを保存する処理を行う
      #    (dart-lang/setup-dart の `lib/main.dart` の `createPubOIDCToken()`
      #    で確認済み)。**この処理は dart-lang/setup-dart 固有であり、
      #    subosito/flutter-action は行わない。**
      # 2. その後 subosito/flutter-action をセットアップする。offline_stt は
      #    Flutter プラグイン(`flutter: sdk: flutter` に依存)であり、
      #    `dart pub get` が Flutter SDK 同梱の pub を使う必要があるため。
      #    `dart-lang/setup-dart` が PATH に通した `dart` はここで Flutter
      #    同梱の `dart` に上書きされるが、トークンは `$PUB_CACHE`(環境変数
      #    として引き継がれる)に保存済みのため影響しない。公式の reusable
      #    workflow (dart-lang/setup-dart/.github/workflows/publish.yml)も
      #    「dart-lang/setup-dart → Flutterセットアップ」の順で同じ構成を
      #    取っており、この順序を踏襲している。
      #
      # 公式 reusable workflow を直接使わなかった理由: あれは1ジョブでSDK
      # セットアップ→dry-run→publish を行うだけで、公開前の format/analyze/
      # test を差し込む余地が無い。
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: melos をインストールする
        run: dart pub global activate melos 8.2.2

      - name: workspace を解決する(Dart Pub Workspaces)
        run: melos bootstrap

      - name: dart format 差分チェック
        run: melos run format

      - name: dart analyze --fatal-infos
        run: melos run analyze

      - name: dart test
        run: melos run test

      - name: dart pub publish --dry-run
        working-directory: ${{ env.PACKAGE_DIR }}
        run: dart pub publish --dry-run

      - name: dart pub publish(OIDC/Trusted Publishing で認証)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: dart pub publish --force
