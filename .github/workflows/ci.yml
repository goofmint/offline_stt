name: CI

# offline_stt の CI(Issue #25)。
#
# 検証すること:
#   - 全パッケージの静的解析(dart analyze --fatal-infos)・ユニットテスト・
#     フォーマット
#   - apps/example の各プラットフォーム向けコンパイル(ビルド検証)
#
# 検証しないこと(design.md §7 の方針どおり、CIはビルド検証に限定する):
#   - 認識E2E(実際に音声ファイルが正しく文字起こしされるか)。以下のとおり
#     実機依存であることが実測済みであり、CI環境では原理的に再現できない。
#       - iOS: シミュレータでは SpeechTranscriber.isAvailable が false に
#         なり、SpeechAnalyzerによる認識自体が利用できない
#         (spikes/darwin/RESULTS.md)
#       - Android: バックエンドは Android 標準の
#         android.speech.SpeechRecognizer(オンデバイス)である
#         (ML Kit GenAI / AICore ではない。M0検証で AICore が使えない
#         ことが判明して差し替えた)。オンデバイス認識のモデルは
#         OS / Google Play services 側が保持しており、エミュレータには
#         存在しないため実機が要る。さらにM0検証で、実機であっても機種に
#         よっては成立しないことが判明している(spikes/android/RESULTS.md)
#       - Web: ブラウザの言語パック(約60MB)取得とChromeの実ブラウザ環境が
#         必要であり、ヘッドレスCIでは再現しない(spikes/web/RESULTS.md)
#     認識E2Eはリリース前の手動チェックリスト(README参照)で運用する。
#
# ランナー・SDKバージョンについて調べた結果(2026-09時点):
#   - macos-26 ラベルは GitHub Actions で 2026-02-26 に GA 済み
#     (Xcode既定 26.4.1、26.5 も選択可能)であり、requirements.md NFR-4 の
#     「iOS 26 / macOS 26 以上」を満たすビルド環境として利用できる。
#   - windows-2025 ラベル(Windows Server 2025)も GA 済みであり、
#     requirements.md NFR-4 が言う「Windows 11 24H2 (build 26100)」と
#     OSビルド世代は揃うが、Windows Server であり Windows 11 クライアント
#     そのものではない点に注意。GitHub Hosted Runnerに Windows 11
#     クライアント版は無い。
#   - offline_stt_windows/windows/CMakeLists.txt はM4(Issue #52)で
#     Microsoft.WindowsAppSDK をNuGetで依存宣言する
#     ようになった。それ以前はTODOコメントのみでWinAppSDKに一切触れて
#     いなかったため、Windowsビルドはバージョン不一致では失敗しなかった。
#     この前提はM4で変わった。当初はCMakeの`VS_PACKAGE_REFERENCES`で
#     NuGet の PackageReference を足す方式にしたが、**このCIで実際に
#     ビルドして失敗した**:
#       error C1083: Cannot open include file:
#       'winrt/Microsoft.Windows.AI.h': No such file or directory
#     WinAppSDKのプロジェクションヘッダーはWindows SDKに含まれず、NuGet
#     パッケージ内の.winmdからcppwinrt.exeが生成するものであり、CMakeが
#     生成する.vcxprojにPackageReferenceを足すだけでは復元も生成も走らない。
#     そのため winapp CLI(`winapp init`)がアプリ側に展開する
#     `.winapp/include` を自動検出する方式へ切り替えた。
#
#     **このCIランナーは winapp CLI を持たないため、Windowsジョブは
#     WinRT実装(speech_backend_winrt.cpp / model_availability.cpp /
#     model_acquisition.cpp / recognition_session.cpp)をビルドしない。**
#     検証されるのはWinRTに触れない部分(Pigeon受け口・スレッド調停・
#     エラー分類・Media Foundation変換)のコンパイルだけである。
#     WinRT実装のコンパイルは Issue #58 の実機検証でしか確認できない。
#
# Issue #59(example appへのWindows動作追加)について:
#   - このCIのWindowsジョブが検証するのは `flutter build windows --debug` が
#     通ること、すなわちコンパイルとリンクだけである。**MSIXパッケージ化は
#     検証しない。** `flutter build windows` が生成するのはパッケージ化
#     されていない素のWin32 EXEであり、Windows AIのモデルへアクセスするのに
#     必要な `systemAIModels` capability はMSIXの Package.appxmanifest に
#     しか書けない。MSIX化は `flutter build windows` の外側の工程であり、
#     手順は apps/example/windows/packaging/README.md と
#     packages/offline_stt_windows/README.md に文書化してある(いずれも
#     Windows実機が無いため未実行)。MSIX生成と認識E2Eは Issue #58 の
#     実機検証の対象である。
#
# Issue #51(example appへのAndroid動作追加)で、**5プラットフォームすべての
# ネイティブプロジェクトがリポジトリにコミット済みになった**:
#   - macos / ios / web ... Issue #41(Deployment Target 26.0 設定済み、
#     offline_stt_darwin.podspec 要件)
#   - windows ........... Issue #59(Flutter 3.41.9 の `flutter create .
#     --platforms=windows --org com.moongift` の出力そのもの。加えて
#     `flutter create` が生成しないMSIXマニフェストを windows/packaging/ に
#     置いてある)
#   - android ........... Issue #51(同じく Flutter 3.41.9 の
#     `flutter create . --platforms=android --org com.moongift` の出力。
#     ただし app/build.gradle.kts の minSdk だけは `flutter.minSdkVersion`
#     (既定 24)ではなく 31 を直接書いてある。offline_stt_android が
#     minSdk 31 を宣言しており、24 のままだとマニフェストのマージが
#     「uses-sdk:minSdkVersion 24 cannot be smaller than version 31
#     declared in library [:offline_stt_android]」で失敗するためである)
#
#   そのため以下のbuildジョブでは、`flutter create .` による再生成も、
#   Deployment Target / minSdk を書き換える sed も一切行わない。ジョブは
#   コミット済みのプロジェクトをそのままビルドする。Issue #51 以前は
#   android だけをジョブ内で都度生成し、minSdk を sed で引き上げていたが、
#   その2ステップは削除した。
#
#   android をコミット対象に含めた理由は、(a) 他の4プラットフォームと
#   扱いを揃えること、(b) minSdk 31 の要件をリポジトリ内で表明でき、CIの
#   sed による書き換えという間接的な手当を無くせること、(c) 実機E2E
#   (Issue #50)を行う人が `flutter create` を自分で再実行することなく
#   `flutter build apk` できること、の3点である。

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.47.5'
  FLUTTER_CHANNEL: 'stable'

jobs:
  analyze-test:
    name: Analyze + Test + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: melos をインストールする
        run: dart pub global activate melos 8.2.2

      - name: workspace を解決する(Dart Pub Workspaces)
        run: melos bootstrap

      - name: dart analyze --fatal-infos(全パッケージ)
        run: melos run analyze

      - name: dart test(test/ を持つパッケージのみ)
        run: melos run test

      - name: dart format 差分チェック(*.g.dart は対象外。理由はmelosスクリプト参照)
        run: melos run format

      # 公開APIドキュメントが生成でき、かつリンク切れが無いことを検証する
      # (Issue #63)。melos の doc スクリプトは apps/example を除外し、
      # 公開6パッケージで `dart doc --validate-links` を実行する。
      - name: dart doc 生成とリンク検証
        run: melos run doc

  build:
    name: Build example (${{ matrix.platform }})
    needs: analyze-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            continue_on_error: false
          - platform: web
            os: ubuntu-latest
            continue_on_error: false
          - platform: windows
            os: windows-2025
            continue_on_error: false
          - platform: macos
            os: macos-26
            # Xcode 26.6 / macOS 26.5.1 でローカルビルド成功を確認済み。
            continue_on_error: false
          - platform: ios
            os: macos-26
            # Xcode 26.6 でローカルビルド成功を確認済み
            # (flutter build ios --no-codesign --debug)。
            continue_on_error: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue_on_error }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: JDK 17 を用意する(Android。build.gradle の sourceCompatibility に合わせる)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle キャッシュ(Android)
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/example/android/**/*.gradle*', 'apps/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # プラットフォームプロジェクトを `flutter create` で都度生成する
      # ステップは、Issue #51 で apps/example/android をリポジトリに
      # コミットした時点で全プラットフォーム分が不要になったため削除した
      # (macos/ios/web は Issue #41、windows は Issue #59 で先にコミット
      # 済みだった)。apps/example 配下の android/ ios/ macos/ web/
      # windows/ はすべてコミット済みの内容がそのまま使われる。
      #
      # 併せて、Android の minSdk を 31 へ引き上げる sed ステップも削除した。
      # apps/example/android/app/build.gradle.kts に `minSdk = 31` を直接
      # 書いてコミットしてあるため、CI実行時に書き換える必要が無い
      # (macos/iOS の Deployment Target 26.0 を sed で引き上げるステップを
      # Issue #41 で削除したのと同じ理由である)。

      - name: flutter build apk --debug
        if: matrix.platform == 'android'
        working-directory: apps/example
        run: flutter build apk --debug

      - name: flutter build ios --no-codesign --debug
        if: matrix.platform == 'ios'
        working-directory: apps/example
        run: flutter build ios --no-codesign --debug

      - name: flutter build macos --debug
        if: matrix.platform == 'macos'
        working-directory: apps/example
        run: flutter build macos --debug

      - name: flutter build windows --debug
        if: matrix.platform == 'windows'
        working-directory: apps/example
        run: flutter build windows --debug

      - name: flutter build web
        if: matrix.platform == 'web'
        working-directory: apps/example
        run: flutter build web
